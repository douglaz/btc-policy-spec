          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A3 'proved that the proposition' build.log | grep -q 'denominator'
          echo "lake build correctly failed on f54_refused_with_current"

      - name: Prove the Lean build rejects a denominator that excludes a spent external deposit (F59)
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def currentExternal : External := .countedWhenSpent$/def currentExternal : External := .alwaysExcluded/' BtcPolicy/Coverage.lean
          grep -q 'def currentExternal : External := .alwaysExcluded' BtcPolicy/Coverage.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with a selected Escape's unconfirmed external input excluded"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 1
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A3 'proved that the proposition' build.log | grep -q 'currentExternal'
          echo "lake build correctly failed on f59_external_refused_with_current"

      - name: Prove the Lean build rejects the CHN-35 claw-back that permits vault change (F57)
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : NoChange := .required$/def current : NoChange := .permitted/' BtcPolicy/Classification.lean
          grep -q 'def current : NoChange := .permitted' BtcPolicy/Classification.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with vault change permitted on a claw-back"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 1
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A3 'proved that the proposition' build.log | grep -q 'burnAdmitted Classification.current 1000 1 = false'
          echo "lake build correctly failed on f57_refused_with_current"

      # DEF-15: the mixed hot-plus-escape arm of CHN-30's classification faulted to escape-class.
      # Classification.lean must still build, or the exhibits that decide the arm are never read.
      - name: Prove the Lean build rejects the CHN-30 mixed arm faulted to escape-class (DEF-15)
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^\(  else if dest.contains (some .escape) && dest.contains (some .hot) then \)none -- mixed$/\1some .escape -- mixed/' BtcPolicy/Classification.lean
          grep -q 'dest.contains (some .hot) then some .escape -- mixed$' BtcPolicy/Classification.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with mixed outputs classified escape-class"
            exit 1
          fi
          grep -A18 '^error: BtcPolicy/' build.log
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 3
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A3 'proved that the proposition' build.log | grep -q 'allowlisted mixedSpend = true ∧ classify mixedSpend = none'
          proof_line="$(awk '/^theorem escape_and_hot_unclassified / {found=1} found && /:= by$/ {print NR; exit}' BtcPolicy/Exhibits.lean)"
          grep -q "^error: BtcPolicy/Exhibits.lean:${proof_line}:.*unsolved goals" build.log
          $SHELL_CMD python3 - <<'PYTHON'
          import re
          from pathlib import Path
          log = Path("build.log").read_text()
          errors = re.findall(r"^error: BtcPolicy/([^:]+):(\d+):.*", log, re.M)
          assert len(errors) == 3, errors
          assert all(file == "Exhibits.lean" for file, _ in errors), errors
          lines = Path("BtcPolicy/Exhibits.lean").read_text().splitlines()
          names = [re.findall(r"^theorem (\w+)", "\n".join(lines[:int(line)]), re.M)[-1]
                   for _, line in errors]
          diagnostics = re.findall(r"^error: (.+?\.lean):\d+:\d+: (.*)$", log, re.M)
          assert len(diagnostics) == len(errors), diagnostics
          assert all(file == "BtcPolicy/Exhibits.lean" for file, _ in diagnostics), diagnostics
          assert list(zip(names, [message for _, message in diagnostics])) == [
              ("def15_mixed_allowlisted_but_unclassified", "Tactic `decide` proved that the proposition"),
              ("escape_and_hot_unclassified", "unsolved goals"),
              ("non_hot_class_zero_outflow", "unsolved goals"),
          ], (names, diagnostics)
          print("mixed-arm classification: exactly 3 proof errors in Exhibits.lean: " + ", ".join(names))
          PYTHON

      # Unknown destinations must not acquire escape classification and zero-budget treatment.
      - name: Prove the Lean build rejects unknown outputs classified as escape (CHN-30)
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          $SHELL_CMD python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("BtcPolicy/Classification.lean")
          source = p.read_text()
          old = """def outputClass (o : Output) : Option Class :=
            if member o == .escape then some .escape
            else if inAllowlist o then some .hot
            else none"""
          new = old.removesuffix("else none") + "else some .escape"
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          assert p.read_text() == source.replace(old, new)
          assert p.read_text().count(new) == 1 and old not in p.read_text()
          PYTHON
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with unknown outputs classified escape-class"
            exit 1
          fi
          grep -A18 '^error: BtcPolicy/' build.log
          $SHELL_CMD python3 - <<'PYTHON'
          import re
          from pathlib import Path
          log = Path("build.log").read_text()
          errors = re.findall(r"^error: BtcPolicy/([^:]+):(\d+):.*", log, re.M)
          assert all(file == "Exhibits.lean" for file, _ in errors), errors
          lines = Path("BtcPolicy/Exhibits.lean").read_text().splitlines()
          names = [re.findall(r"^theorem (\w+)", "\n".join(lines[:int(line)]), re.M)[-1]
                   for _, line in errors]
          diagnostics = re.findall(r"^error: (.+?\.lean):\d+:\d+: (.*)$", log, re.M)
          assert len(errors) == 1, (errors, names)
          assert len(diagnostics) == len(errors), diagnostics
          assert all(file == "BtcPolicy/Exhibits.lean" for file, _ in diagnostics), diagnostics
          assert list(zip(names, [message for _, message in diagnostics])) == [
              ("non_hot_class_zero_outflow", "unsolved goals"),
          ], (names, diagnostics)
