            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case latched_unscanned_serves_cold_with_current$'
          if grep -A1 'unsolved goals' build.log | grep -q '^case failed_attempt_starts_no_scan_with_current$'; then
            echo "::error::the walk after a failed attempt went red under noFirstScan, which walks on too"
            exit 1
          fi
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A2 'proved that the proposition' build.log | grep -q 'serve currentRules vaultLedger deltaUnscannedState deltaView deltaView deltaView deltaTipWalk ='
          echo "lake build correctly failed on latched_unscanned_serves_cold_with_current and latched_unscanned_cold_scans"

      # The chain tie (WTC-6 and WTC-12 as read since 2026-10-02, bps-8s0.11.25): a walk that covers
      # its range is committed on whichever branch WTC-12's check on the view read after its loop
      # finds it, as current, against the reading of 2026-10-01 that amendment withdraws, under
      # which the walk's last block must also be active on the view captured when the walk starts.
      # The flip refutes the universal that a covering walk is committed on any branch and the
      # exhibit in which a walk read on the branch the chain moved to is committed and read at
      # fire time. The tied half, where that walk is discarded for a cold scan, is written out in
      # full beside the parameter (off_branch_walk_refused_with_tied) and stays green, as does
      # every walk read on the chain its range was measured against, which both values commit.
      - name: Prove the Lean build rejects a delta walk discarded for the branch it was read on (WTC-6, WTC-12)
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def currentChainTie : ChainTie := .untied$/def currentChainTie : ChainTie := .tied/' BtcPolicy/VaultUnspent.lean
          grep -q '^def currentChainTie : ChainTie := .tied$' BtcPolicy/VaultUnspent.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with a delta walk discarded for the branch it was read on"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 2
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the chain tie flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case walk_committed_on_any_branch_with_current$'
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A5 'proved that the proposition' build.log | grep -q 'serve currentRules vaultLedger deltaState deltaView deltaView deltaView deltaForkWalk ='
          echo "lake build correctly failed on walk_committed_on_any_branch_with_current and off_branch_walk_committed"

      # The latch scope (WTC-9 as amended 2026-10-02, bps-8s0.11.25): the repair latch only for a
      # wallet that holds a completion marker, as current, against the reading that amendment
      # withdraws, under which a wallet holding no marker meets the latch condition with nothing to
      # check. The flip refutes WTC-9's universal that observing leaves such a wallet's latch as it
      # was and the exhibit in which a node whose first build failed is not latched and serves a
      # walk from its cache. The vacuous half, where the observation latches it and the refresh
      # cold-scans, is written out in full beside the parameter
      # (unbuilt_wallet_latches_with_vacuous) and stays green, as does every wallet that holds a
      # marker, which both values treat alike. It also refutes joint attempt-invariant
      # preservation: observing a running first build latches it and clears its scan state.
      - name: Prove the Lean build rejects a repair latch on a wallet holding no marker (WTC-9)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def currentLatchScope : LatchScope := .scoped$/def currentLatchScope : LatchScope := .vacuous/' BtcPolicy/VaultUnspent.lean
          grep -q '^def currentLatchScope : LatchScope := .vacuous$' BtcPolicy/VaultUnspent.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with the repair latch set on a wallet holding no marker"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 3
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the latch scope flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case unbuilt_wallet_never_latches_with_current$'
          grep -A1 'unsolved goals' build.log | grep -q '^case attemptInvariant_observe_with_current$'
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A1 'proved that the proposition' build.log | grep -q 'State.observe currentLatchScope deltaView unbuiltState = unbuiltState'
          echo "lake build correctly failed on unbuilt_wallet_never_latches_with_current, unbuilt_wallet_not_latched and attemptInvariant_observe_with_current"

      # Watchtower recognition: the
      # Recognition guard Alerts.lean owns, current := validated (WTC-18). ADR-0001 read
      # recognition off the co-signed set and ADR-0012 revised it to validation; the two flips
      # are the two readings WTC-18's own sentences refute, co-signing and evaluation. Each is
      # red only in Exhibits.lean, and every counted error is a refutation: the WTC-18
      # universals over current whose proposition the reading falsifies, and the federation
      # twins it falsifies. The twins beside the parameter name .coSigned and .evaluated in
      # full and stay green; so do the two universals a flip leaves true, whose proofs
      # case-split on the guard and close under every value the proposition holds, which each
      # step asserts by requiring their names absent from the log's unsolved-goal case lines,
      # where a red universal's name lands; a warning naming one is not a red (bps-8s0.11.9).
      - name: Prove the Lean build rejects recognition by co-signing (WTC-18, ADR-0001)
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : Recognition := .validated$/def current : Recognition := .coSigned/' BtcPolicy/Alerts.lean
          grep -q '^def current : Recognition := .coSigned$' BtcPolicy/Alerts.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with recognition by co-signing"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 4
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the recognition flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case accepted_recognised_with_current.coSigned.refl$'
          grep -A1 'unsolved goals' build.log | grep -q '^case accepted_everywhere_silent_with_current.coSigned.refl$'
          if grep -q -e '^case refused_not_recognised_with_current\.' -e '^case refused_everywhere_alerts_with_current\.' build.log; then
            echo "::error::a theorem recognition by co-signing leaves true went red"
            exit 1
          fi
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A1 'proved that the proposition' build.log | grep -q 'alerting current federation legitSpend = 0'
          grep -A5 'proved that the proposition' build.log | grep -q 'alerting current federation shortAuthorized = 0'
          echo "lake build correctly failed on accepted_recognised_with_current, accepted_everywhere_silent_with_current, legit_silent_with_current and recovery_never_swallowed_with_current"

      - name: Prove the Lean build rejects recognition by evaluation (WTC-18, ADR-0012)
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : Recognition := .validated$/def current : Recognition := .evaluated/' BtcPolicy/Alerts.lean
          grep -q '^def current : Recognition := .evaluated$' BtcPolicy/Alerts.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with recognition by evaluation"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 3
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the recognition flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case refused_not_recognised_with_current.evaluated.refl$'
          grep -A1 'unsolved goals' build.log | grep -q '^case refused_everywhere_alerts_with_current.evaluated.refl$'
          if grep -q -e '^case accepted_recognised_with_current\.' -e '^case accepted_everywhere_silent_with_current\.' build.log; then
            echo "::error::a theorem recognition by evaluation leaves true went red"
            exit 1
          fi
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A1 'proved that the proposition' build.log | grep -q 'countVerdict Verdict.unrecognizedSpend current federation theftSpend = 5'
          echo "lake build correctly failed on refused_not_recognised_with_current, refused_everywhere_alerts_with_current and theft_alerts_everywhere_with_current"

      # Package ancestry and replacement: the ReplacementAncestry guard Package.lean owns,
      # current := overResident
      # (WTC-24, WTC-25). The flip to plainRead is F54's first row, "WTC-24 read the resident's
      # inputs as spent": the prevout read applied as it stands, nothing admitting the resident's
      # inputs for the replacement. Red only in Exhibits.lean: the WTC-25 replacement admitted
      # over current and the twin, R' over [X, Y] with the read showing neither. The twin's
      # refused half names .plainRead in full beside the parameter and stays green, as do the
      # positive exhibits with no resident, which both values admit.
      - name: Prove the Lean build rejects the replacement's ancestry read plain (F54)
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : ReplacementAncestry := .overResident$/def current : ReplacementAncestry := .plainRead/' BtcPolicy/Package.lean
          grep -q '^def current : ReplacementAncestry := .plainRead$' BtcPolicy/Package.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with the replacement's ancestry read plain"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 2
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the replacement ancestry flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A1 'unsolved goals' build.log | grep -q '^case replacement_admitted_with_current$'
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          grep -A1 'proved that the proposition' build.log | grep -q 'validate current twinCreator twinSnapshot twinMembership twinAuthorized twinReplacement (some twinResident)'
          echo "lake build correctly failed on replacement_admitted_with_current and twin_admitted_with_current"

      # DEF-1 is also a type error: a Wall passed where a Mono is expected, the raw field, and a
      # minted constructor are each refused for the stated reason; and the check is live — a
      # coercion added to Clocks.lean makes the first term compile.
      - name: Prove the clock types refuse the DEF-1 term, and that the check is live
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          $SHELL_CMD lake build BtcPolicy.Kernel
          cat > "$tmp/Def1.lean" <<'EOF'
          import BtcPolicy.Kernel
          open BtcPolicy.Clocks BtcPolicy.Kernel
          def tickWall (env : Env) (n : Node) : Node :=
            { n with carriers := n.carriers.filter fun k => Mono.before env.wall k.D }
          EOF
          cat > "$tmp/Def1Hole.lean" <<'EOF'
          import BtcPolicy.Kernel
          open BtcPolicy.Clocks BtcPolicy.Kernel
          def holeRawField (env : Env) (k : Carrier) : Bool := decide (env.wall.s < k.D.s)
          EOF
          cat > "$tmp/Def1Minted.lean" <<'EOF'
          import BtcPolicy.Kernel
          open BtcPolicy.Clocks BtcPolicy.Kernel
          def holeMinted (env : Env) (k : Carrier) : Bool := Mono.before ⟨0⟩ k.D
          EOF
          if $SHELL_CMD lake env lean "$tmp/Def1.lean" > def1.log 2>&1; then
            echo "::error::a Wall sample was accepted where a Mono deadline is compared"
            exit 1
          fi
          grep -q 'error: Application type mismatch' def1.log
          if $SHELL_CMD lake env lean "$tmp/Def1Hole.lean" > hole.log 2>&1; then
            echo "::error::a raw clock field was readable outside Clocks.lean"
            exit 1
          fi
          grep -q 'Field `s` from structure `BtcPolicy.Clocks.Wall` is private' hole.log
          if $SHELL_CMD lake env lean "$tmp/Def1Minted.lean" > minted.log 2>&1; then
            echo "::error::a Mono was minted outside Clocks.lean"
            exit 1
          fi
          grep -q 'Constructor for `BtcPolicy.Clocks.Mono` is marked as private' minted.log
          sed -i 's/^end BtcPolicy.Clocks$/instance : Coe Wall Mono := ⟨fun w => ⟨w.s⟩⟩\nend BtcPolicy.Clocks/' BtcPolicy/Clocks.lean
          grep -q '^instance : Coe Wall Mono' BtcPolicy/Clocks.lean
          $SHELL_CMD lake build BtcPolicy.Kernel
          if ! $SHELL_CMD lake env lean "$tmp/Def1.lean" > coe.log 2>&1; then
            echo "::error::the DEF-1 term still failed with a Wall-to-Mono coercion declared -- the type check is not what refuses it"
            exit 1
          fi
          echo "clock types correctly refused the DEF-1 term, the raw field and the minted constructor, and a coercion made the term compile"

      # ADR-0023 decision 8: the future implementation imports tools/formal as a lake git
      # dependency from this repository's subdirectory at a pinned commit. A consumer project
      # in a scratch directory requires it at the checked-out commit and builds a theorem
      # over the kernel and the witness weight; the subdirectory packaging is tested here.
      - name: Prove tools/formal is consumable as a lake git dependency from the subdirectory
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sha="$(git rev-parse HEAD)"
          mkdir "$tmp/consumer"
          cp tools/formal/lean-toolchain "$tmp/consumer/"
          cat > "$tmp/consumer/lakefile.toml" <<EOF
          name = "consumer"
          defaultTargets = ["Consumer"]

          [[lean_lib]]
          name = "Consumer"

          [[require]]
          name = "btc-policy-formal"
          git = "file://${{ github.workspace }}"
          rev = "$sha"
          subDir = "tools/formal"
          EOF
          cat > "$tmp/consumer/Consumer.lean" <<'EOF'
          import BtcPolicy.Kernel
          import BtcPolicy.Witness
          open BtcPolicy.Kernel BtcPolicy.Witness
          theorem consumer_sees_the_kernel (r : Rules) (w : World) (h : Reachable r w) : Inv w :=
            inv_reachable r w h
          theorem consumer_sees_W : W 2 3 = 480 := by decide
          EOF
          cd "$tmp/consumer"
          $SHELL_CMD lake build
          grep -q '"subDir": "tools/formal"' lake-manifest.json
          grep -q "\"rev\": \"$sha\"" lake-manifest.json
          echo "a consumer project built against tools/formal at $sha from the subdirectory"

      - name: Prove the axiom gate rejects a sorry the build accepts
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^theorem width : past + future = 360 := by decide$/theorem width : past + future = 360 := by sorry/' BtcPolicy/Freshness.lean
          grep -q ':= by sorry' BtcPolicy/Freshness.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a proof that uses sorry"
            exit 1
          fi
          grep -q 'sorryAx' gate.err
          echo "axiom gate correctly rejected sorryAx while lake build stayed green"

      - name: Prove the axiom gate rejects native_decide everywhere, Explore included
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          cat >> BtcPolicy/Exhibits.lean <<'EOF'

          namespace BtcPolicy.Explore
          theorem in_explore : BtcPolicy.Deadline.shrink 10 100 1 11 = 11 := by native_decide
          end BtcPolicy.Explore
          namespace BtcPolicy.Exhibits
          theorem outside_explore : BtcPolicy.Deadline.shrink 10 100 1 11 = 11 := by native_decide
          end BtcPolicy.Exhibits
          EOF
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed native_decide"
            exit 1
          fi
          grep -q 'outside_explore depends on \[BtcPolicy.Exhibits.outside_explore._native.native_decide' gate.err
          grep -q 'in_explore depends on \[BtcPolicy.Explore.in_explore._native.native_decide' gate.err
          grep -q 'minted by native_decide' gate.err
          echo "axiom gate correctly refused native_decide inside and outside Explore, and its minted axioms"

      - name: Prove the axiom gate rejects a project axiom, even inside Explore
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\nnamespace BtcPolicy.Explore\naxiom leak : 1 = 1\nend BtcPolicy.Explore\n' >> BtcPolicy/Exhibits.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a project axiom"
            exit 1
          fi
          grep -q 'leak is an axiom' gate.err
          echo "axiom gate correctly rejected the project axiom"

      # Ownership is by module, not namespace: an axiom declared at the ROOT of a project
      # file, outside every BtcPolicy.* namespace, is still the project's.
      - name: Prove the axiom gate rejects a project axiom declared outside the namespace
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\naxiom rootLeak : 1 = 1\n' >> BtcPolicy/Exhibits.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a root-level project axiom"
            exit 1
          fi
          grep -q 'rootLeak is an axiom' gate.err
          echo "axiom gate correctly rejected the root-level project axiom"

      # There is no exemption for a name that looks minted: an axiom is an axiom.
      - name: Prove the axiom gate rejects a hand-written axiom imitating the minted name
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\nnamespace BtcPolicy.Explore\n/-- looks minted -/ @[simp] axiom foo._native.native_decide.ax_1_1 : False\nend BtcPolicy.Explore\n' >> BtcPolicy/Exhibits.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a hand-written axiom named like the minted one"
            exit 1
          fi
          grep -q 'foo._native.native_decide.ax_1_1 is an axiom' gate.err
          echo "axiom gate correctly rejected the imitation axiom, prefix and all"

      # An executable root cannot be imported by the gate, so it is held to one import and one
      # main; the emitters' code lives in BtcPolicy.Exe, which the walk covers whatever the source
      # line looks like (attribute, docstring, set_option).
      - name: Prove the formal gate rejects content in an executable root
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n/-- a leak -/ @[simp] axiom rootExeLeak : (1 : Nat) = 1\n' >> tools/formal/Values.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed an attributed axiom in Values.lean"
            exit 1
          fi
          grep -q 'Values.lean is not the one-line executable root' formal.log
          echo "formal gate correctly rejected content in an executable root"

      - name: Prove the axiom gate rejects an attributed axiom in the emitter module
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\n/-- a leak -/ @[simp] axiom BtcPolicy.Exe.leak : (1 : Nat) = 1\n' >> BtcPolicy/Exe.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed an attributed axiom in BtcPolicy.Exe"
            exit 1
          fi
          grep -q 'BtcPolicy.Exe.leak is an axiom' gate.err
          echo "axiom gate correctly rejected the attributed axiom by the walk, whatever its source line"

      # Gate.lean is a root too: content there would escape the walk, so it is held to one line.
      - name: Prove the formal gate rejects content in the gate's own root
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n@[req "CHN-4"] theorem leak : False := by sorry\n' >> tools/formal/Gate.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed content in Gate.lean"
            exit 1
          fi
          grep -q 'Gate.lean is not the one-line executable root' formal.log
          echo "formal gate correctly rejected content in the gate root"

      # The orphan walk reads imports through Lean: a commented-out `import` does not count.
      - name: Prove the formal gate rejects a module reachable only through a comment
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf 'import BtcPolicy.Req\nnamespace BtcPolicy.Orphan\ndef unread : Nat := 1\nend BtcPolicy.Orphan\n' > tools/formal/BtcPolicy/Orphan.lean
          printf '\n-- import BtcPolicy.Orphan\n' >> tools/formal/BtcPolicy.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate counted a commented-out import as reachability"
            exit 1
          fi
          grep -q 'nothing imports BtcPolicy.Orphan' formal.log
          echo "formal gate correctly ignored the commented-out import"

      # A tag names a formalization; a withdrawn id defines nothing to formalize.
      - name: Prove the identifier gate rejects a tag naming a withdrawn id
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\nnamespace BtcPolicy.Exhibits\n@[req "CHN-33"] def onWithdrawn : Nat := 1\nend BtcPolicy.Exhibits\n' >> tools/formal/BtcPolicy/Exhibits.lean
          $SHELL_CMD bash tools/check_formal.sh --no-replay > formal.log 2>&1
          if $SHELL_CMD python3 tools/check_ids.py > ids.log 2>&1; then
            echo "::error::identifier gate passed a tag naming the withdrawn CHN-33"
            exit 1
          fi
          grep -q "TAGS NAMING UNDEFINED IDS: \[('BtcPolicy.Exhibits.onWithdrawn', 'CHN-33')\]" ids.log
          echo "identifier gate correctly rejected the tag naming a withdrawn id"

      # The emitters print what the kernel proved about: no compiled-evaluation override.
      - name: Prove the formal gate rejects implemented_by in the formal tree, written over several lines
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\ndef fastCap := BtcPolicy.Cursor.quotaRungCap\nattribute [\n  implemented_by fastCap\n] BtcPolicy.Cursor.quotaRungCap\n' >> tools/formal/BtcPolicy/Exhibits.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed an implemented_by attribute"
            exit 1
          fi
          grep -q 'implemented_by / extern / csimp in tools/formal/' formal.log
          echo "formal gate correctly rejected implemented_by"

      # CHN-2's "up to 8-of-15; n ≤ 15" is one derived figure: moving the node limit without the
      # shapes is red at max_shape, as the deleted arithmetic gate's equality check was.
      - name: Prove the Lean build rejects a node limit the shapes no longer reach
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^@\[req "CHN-2"\] def nodeLimit : Nat := 15$/@[req "CHN-2"] def nodeLimit : Nat := 17/' BtcPolicy/Shapes.lean
          grep -q 'def nodeLimit : Nat := 17' BtcPolicy/Shapes.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with a node limit the shapes do not reach"
            exit 1
          fi
          grep -q 'error: BtcPolicy/Shapes.lean:.*decide. proved that the proposition' build.log
          echo "lake build correctly failed on max_shape"

      # A source file anywhere else in the tree is never built, indexed or replayed.
      - name: Prove the formal gate rejects a Lean file outside BtcPolicy/ and the roots
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          mkdir -p tools/formal/Scratch && printf 'axiom stray : False\n' > tools/formal/Scratch/Proof.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed a Lean file in an unexpected subdirectory"
            exit 1
          fi
          grep -q 'Scratch/Proof.lean is a Lean file outside BtcPolicy/' formal.log
          echo "formal gate correctly rejected the stray subdirectory module"

      # A CNF tag written with a string escape passes the text grep; the gate reads the tag as
      # Lean did and refuses it anyway.
      - name: Prove the axiom gate rejects a CNF tag whatever its source spelling
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\nnamespace BtcPolicy.Exhibits\n@[req "CNF-\\x337"] def escaped : Nat := 1\nend BtcPolicy.Exhibits\n' >> BtcPolicy/Exhibits.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed an escaped CNF tag"
            exit 1
          fi
          grep -q 'escaped is tagged @\[req "CNF-37"\], a conformance item' gate.err
          echo "axiom gate correctly rejected the escaped CNF tag"

      # A macro that expands to implemented_by passes every source grep; the gate reads the
      # attribute as Lean recorded it.
      - name: Prove the axiom gate rejects a macro-expanded implemented_by
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          $SHELL_CMD python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("BtcPolicy/Cursor.lean"); s = p.read_text()
          anchor = "/-- One row of the table: `(quota, inputs, floor, a, last, cap)`. -/"
          inject = 'def fastCap (_ : Anchor) (_ _ _ _ _ : Nat) : Option Nat := some 99\nsyntax "impl_via" : attr\nmacro_rules | `(attr| impl_via) => `(attr| implemented_by fastCap)\nattribute [impl_via] quotaRungCap\n\n'
          assert anchor in s
          p.write_text(s.replace(anchor, inject + anchor, 1))
          EOF
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a macro-expanded implemented_by"
            exit 1
          fi
          grep -q 'quotaRungCap has an implemented_by attribute' gate.err
          echo "axiom gate correctly rejected the macro-expanded implemented_by"

      # A @[csimp] lemma proved by sorry is untagged, so a policy over tagged declarations only
      # never saw it, while the emitters printed its replacement (bps-few). The gate's axiom
      # walk covers every constant; the source grep refuses the attribute before the build.
      - name: Prove the axiom gate rejects an untagged csimp lemma proved by sorry
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          $SHELL_CMD python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("BtcPolicy/Cursor.lean"); s = p.read_text()
          anchor = "end BtcPolicy.Cursor"
          inject = 'def fastCap (_ : Anchor) (_ _ _ _ _ : Nat) : Option Nat := some 99\n@[csimp] theorem quotaRungCap_fast : @quotaRungCap = @fastCap := by sorry\n\n'
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, inject + anchor, 1))
          EOF
          if $SHELL_CMD bash ../check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed a csimp attribute in the source"
            exit 1
          fi
          grep -q 'implemented_by / extern / csimp in tools/formal/' formal.log
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed an untagged csimp lemma proved by sorry"
            exit 1
          fi
          grep -q 'quotaRungCap_fast depends on \[sorryAx\]' gate.err
          echo "axiom gate correctly rejected the untagged sorry behind the csimp lemma"

      - name: Prove the formal gate rejects a declaration tagged twice
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\nnamespace BtcPolicy.Exhibits\n@[req "CHN-4", req "CHN-2"] def twice : Nat := 1\nend BtcPolicy.Exhibits\n' >> tools/formal/BtcPolicy/Exhibits.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed a declaration tagged twice"
            exit 1
          fi
          grep -q 'tagged @\[req\] twice' formal.log
          echo "formal gate correctly rejected the double tag"

      # Lean accepts a tag bracket split across lines; a per-line or exact-spacing grep would not
      # see it. The next two steps hold both @[req] checks to the multiline form.
      - name: Prove the formal gate rejects a declaration tagged twice, written over several lines
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\nnamespace BtcPolicy.Exhibits\n@[req\n  "CHN-4", req\n  "CHN-2"] def twice : Nat := 1\nend BtcPolicy.Exhibits\n' >> tools/formal/BtcPolicy/Exhibits.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed a declaration tagged twice over several lines"
            exit 1
          fi
          grep -q 'tagged @\[req\] twice' formal.log
          echo "formal gate correctly rejected the multiline double tag"

      - name: Prove the formal gate rejects an attribute [req] retag written over several lines
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\nattribute [\n  req "CHN-4"\n] BtcPolicy.Cursor.quotaRungCap\n' >> tools/formal/BtcPolicy/Exhibits.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed an attribute [req] retag over several lines"
            exit 1
          fi
          grep -q 'attribute \[req …\] applied after the declaration' formal.log
          echo "formal gate correctly rejected the multiline retag"

      - name: Prove the formal gate rejects a CNF identifier in the formal tree
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n-- exercised by CNF-47\n' >> tools/formal/BtcPolicy/Deadline.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed a CNF identifier in tools/formal/"
            exit 1
          fi
          grep -q 'a CNF identifier in tools/formal/' formal.log
          echo "formal gate correctly rejected the CNF identifier"

      - name: Prove the axiom gate rejects a tagged declaration inside Explore
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          printf '\nnamespace BtcPolicy.Explore\n@[req "CHN-4"] def tagged_here : Nat := 1\nend BtcPolicy.Explore\n' >> BtcPolicy/Exhibits.lean
          $SHELL_CMD lake build
          if $SHELL_CMD lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a tagged declaration inside Explore"
            exit 1
          fi
          grep -q 'tagged_here is tagged @\[req "CHN-4"\] inside BtcPolicy.Explore' gate.err
          echo "axiom gate correctly rejected the tagged declaration inside Explore"

      - name: Prove the formal gate rejects a module the build never reads
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf 'import BtcPolicy.Req\nnamespace BtcPolicy.Orphan\ndef unread : Nat := 1\nend BtcPolicy.Orphan\n' > tools/formal/BtcPolicy/Orphan.lean
          if $SHELL_CMD bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed with Orphan.lean unimported"
            exit 1
          fi
          grep -q 'nothing imports BtcPolicy.Orphan' formal.log
          echo "formal gate correctly rejected the orphaned module"

      # The name resolver: a declaration renamed under a document that cites it is a
      # dangling citation, and the citations gate is where it goes red.
      - name: Prove the citation gate rejects a declaration name the index does not carry
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i '0,/`BtcPolicy.Render.spn38Table`/s//`BtcPolicy.Render.spn38Tabl`/' 04-spend-lifecycle.md
          grep -q 'spn38Tabl`' 04-spend-lifecycle.md
          if $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1; then
            echo "::error::citation gate passed a BtcPolicy.* name the index does not carry"
            exit 1
          fi
          grep -q 'cites `BtcPolicy.Render.spn38Tabl`, which the index does not carry' citations.log
          echo "citation gate correctly rejected the dangling declaration name"

      # A tag is a citation: `@[req "CHN-9999"]` names an id nothing defines, and the
      # identifier gate reads the index the formal gate wrote.
      - name: Prove the identifier gate rejects a tag naming an undefined id
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\nnamespace BtcPolicy.Exhibits\n@[req "CHN-9999"] def bogus : Nat := 1\nend BtcPolicy.Exhibits\n' >> tools/formal/BtcPolicy/Exhibits.lean
          $SHELL_CMD bash tools/check_formal.sh --no-replay > formal.log 2>&1
          if $SHELL_CMD python3 tools/check_ids.py > ids.log 2>&1; then
            echo "::error::identifier gate passed a tag naming CHN-9999"
            exit 1
          fi
          grep -q "TAGS NAMING UNDEFINED IDS: \[('BtcPolicy.Exhibits.bogus', 'CHN-9999')\]" ids.log
          echo "identifier gate correctly rejected the tag naming an undefined id"

      # And the edit one line OUTSIDE a rendered region is not drift: the regions gate
      # must stay green on it, or every prose edit near a table would be red.
      - name: Prove the regions gate passes an edit outside every region
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i '0,/^<!-- \/formal -->$/s//<!-- \/formal -->\n**SPN-9999** is the line right after the closing marker, outside the region./' 04-spend-lifecycle.md
          $SHELL_CMD python3 tools/check_regions.py
          echo "regions gate correctly passed the edit outside the regions"

      # A step runs only on the shard its `if:` names: one that names none runs on every
      # shard, and one naming a shard outside the matrix is a control that stopped running
      # while the run stayed green.
      - name: Hold the workflow to its shard layout
        if: matrix.shard == 0
        run: nix develop --command python3 tools/check_shards.py

      - name: Prove the shard guard can fail
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          if ! $SHELL_CMD python3 tools/check_shards.py; then
            echo "::error::shard guard rejected the workflow as committed"
            exit 1
          fi
          sed -i '/^      - name: Prove the identifier gate can fail$/{n;d}' .github/workflows/gates.yml
          rc=0; $SHELL_CMD python3 tools/check_shards.py > shards.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat shards.log
            echo "::error::shard guard exited $rc, not 1, on a control step with no if:"
            exit 1
          fi
          if ! grep -qxF "FAIL: step 'Prove the identifier gate can fail' has if: None, not 'matrix.shard == N' with N in the shard list" shards.log; then
            cat shards.log
            echo "::error::shard guard went red without naming the control step that lost its if:"
            exit 1
          fi
          echo "shard guard correctly rejected a control step that would run on every shard"
