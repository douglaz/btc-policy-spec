                "non_hot_class_zero_outflow (unsolved goals)")
          PYTHON

      # POL-10: trusting a hint to skip an output must break the build. It fails at the shared
      # output scan's lemmas; Lean admits a failed lemma, so theorems proved from it such as
      # hints_never_admit report nothing. Attribute every failure to its declaration in Evaluate.lean.
      - name: Prove the Lean build rejects destination recognition by hint (POL-10)
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^      (if recognised cfg o then none else some (hs.headD false)) :: -- hint-trust$/      (if recognised cfg o || hs.headD false then none else some (hs.headD false)) :: -- hint-trust/' BtcPolicy/Evaluate.lean
          grep -qxF '      (if recognised cfg o || hs.headD false then none else some (hs.headD false)) :: -- hint-trust' BtcPolicy/Evaluate.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with hints trusted for destination recognition"
            exit 1
          fi
          grep -A12 '^error: BtcPolicy/' build.log
          $SHELL_CMD python3 - <<'PYTHON'
          import re
          from pathlib import Path
          log = Path("build.log").read_text()
          errors = re.findall(r"^error: BtcPolicy/([^:]+):(\d+):.*", log, re.M)
          assert all(file == "Evaluate.lean" for file, _ in errors), errors
          lines = Path("BtcPolicy/Evaluate.lean").read_text().splitlines()
          names = [re.findall(r"^theorem (\w+)", "\n".join(lines[:int(line)]), re.M)[-1]
                   for _, line in errors]
          diagnostics = re.findall(r"^error: (.+?\.lean):\d+:\d+: (.*)$", log, re.M)
          assert len(errors) == 4, (errors, names)
          assert len(diagnostics) == len(errors), diagnostics
          assert all(file == "BtcPolicy/Evaluate.lean" for file, _ in diagnostics), diagnostics
          # Pin both declaration and proof diagnostic: unrelated elaboration failures do not count.
          assert list(zip(names, [message for _, message in diagnostics])) == [
              ("firstUnknown_cons", "unsolved goals"),
              ("outputChecks_empty_iff", "unsolved goals"),
              ("outputChecks_get", "unsolved goals"),
              ("destinationFaults_hints", "Type mismatch"),
          ], (names, diagnostics)
          print("hint trust: 4 proof errors in Evaluate.lean: firstUnknown_cons (1), "
                "outputChecks_empty_iff (1), outputChecks_get (1), destinationFaults_hints (1)")
          PYTHON

      # Reversing the complete output list must break the general outer-code agreement.
      - name: Prove the Lean build rejects reversed output fault order (API-25)
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^  else destinationFaults cfg p -- fault-output-order$/  else (destinationFaults cfg p).reverse -- fault-output-order/' BtcPolicy/Evaluate.lean
          grep -qxF '  else (destinationFaults cfg p).reverse -- fault-output-order' BtcPolicy/Evaluate.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with the output fault scan reversed"
            exit 1
          fi
          grep -A12 '^error: BtcPolicy/' build.log
          $SHELL_CMD python3 - <<'PYTHON'
          import re
          from pathlib import Path
          log = Path("build.log").read_text()
          errors = re.findall(r"^error: BtcPolicy/([^:]+):(\d+):.*", log, re.M)
          assert all(file == "Evaluate.lean" for file, _ in errors), errors
          lines = Path("BtcPolicy/Evaluate.lean").read_text().splitlines()
          names = [re.findall(r"^theorem (\w+)", "\n".join(lines[:int(line)]), re.M)[-1]
                   for _, line in errors]
          diagnostics = re.findall(r"^error: (.+?\.lean):\d+:\d+: (.*)$", log, re.M)
          assert len(errors) == 6, (errors, names)
          assert len(diagnostics) == len(errors), diagnostics
          assert all(file == "BtcPolicy/Evaluate.lean" for file, _ in diagnostics), diagnostics
          assert list(zip(names, [message for _, message in diagnostics])) == [
              ("destinationFaults_selected", "unsolved goals"),
              ("faults_head_code", "Type mismatch: After simplification, term"),
              ("faults_hints_positions", "'change' tactic failed, pattern"),
