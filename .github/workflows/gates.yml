name: gates

# The reference implementation's own history is why this workflow proves the gates
# can fail: its launch gate ran red for dozens of consecutive runs before anyone
# noticed (btc-policy-9yf), and a green check that asserts nothing is worse than no
# check. So every gate that can be broken on purpose is broken on purpose here, on a
# scratch copy, and the run fails if the gate does not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The formal layer (ADR-0023) needs Lean; flake.nix is the one place the toolchain
  # and the gates' Python are pinned, so every step enters the same shell a developer
  # does. Controls run in scratch copies, so the shell is named by the checkout path.
  SHELL_CMD: nix develop ${{ github.workspace }} --command

jobs:
  gates:
    name: specification gates (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run all gates
        if: matrix.shard == 0
        run: nix develop --command bash tools/check-all.sh

      # The controls copy tools/formal/.lake, and the citation, copies and regions controls
      # read the index, regions and values in it; a shard that does not run every gate
      # builds them here. The kernel replay is the full gate's, on shard 0.
      - name: Build the formal layer the controls copy
        if: matrix.shard != 0
        run: nix develop --command bash tools/check_formal.sh --no-replay

      - name: Prove the identifier gate can fail
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n**OVR-9999** A citation to `DOM-9999`, which does not exist.\n' >> 00-overview.md
          if $SHELL_CMD python3 tools/check_ids.py; then
            echo "::error::identifier gate passed a document with a dangling citation"
            exit 1
          fi
          echo "identifier gate correctly rejected a dangling citation"

      - name: Prove the obligation gate can fail
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n**OVR-9998** The node `DOM-1` MUST record `a_column_dom1_never_mentions`.\n' \
            >> 00-overview.md
          if $SHELL_CMD python3 tools/check_obligations.py; then
            echo "::error::obligation gate passed a duty its target never mentions"
            exit 1
          fi
          echo "obligation gate correctly rejected an orphaned obligation"

      - name: Prove the citation gate can fail
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n`OVR-1` says "a phrase OVR-1 has never contained anywhere".\n' \
            >> 00-overview.md
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a quote its target does not contain"
            exit 1
          fi
          if ! grep -q '00-overview.md attributes to OVR-1 a phrase OVR-1 does not contain' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without naming the false OVR-1 quote in 00-overview.md"
            exit 1
          fi
          echo "citation gate correctly rejected an unverifiable quoted attribution"

      # The same rule over a Lean docstring, held to the same exit code and diagnostic: exit 2
      # is the missing-index crash, and a red for the wrong reason is not evidence.
      - name: Prove the citation gate can fail on a Lean docstring
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n/-- `OVR-1` says "a phrase OVR-1 has never contained anywhere". -/\n' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a false quote in a Lean docstring"
            exit 1
          fi
          if ! grep -q 'tools/formal/BtcPolicy/Delivery.lean attributes to OVR-1 a phrase OVR-1 does not contain' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without naming the false OVR-1 quote in Delivery.lean"
            exit 1
          fi
          echo "citation gate correctly rejected an unverifiable quote in a Lean docstring"

      # Direct possessives use the same ownership, quote and exemption checks as speech verbs
      # and colons. Run the entry point, with the generated index copied, for every case.
      - name: Prove the citation gate checks direct possessive quotations and preserves their contracts
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          $SHELL_CMD python3 - <<'EOF'
          import pathlib
          import re
          import subprocess
          import sys

          assert pathlib.Path("tools/formal/.lake/index.jsonl").is_file()
          baseline = pathlib.Path("tools/citation-baseline.json").read_bytes()

          def gate():
              result = subprocess.run([sys.executable, "tools/check_citations.py"],
                                      capture_output=True, text=True)
              assert pathlib.Path("tools/citation-baseline.json").read_bytes() == baseline
              return result.returncode, result.stdout + result.stderr

          def count(output):
              match = re.search(r"quoted attributions verified: (\d+), (\d+) of them", output)
              assert match, output
              return tuple(map(int, match.groups()))

          rc, output = gate()
          assert rc == 0, output
          initial = count(output)

          def verify(label, source, rc, output, owner=None, kind="attributes", delta=0):
              if owner is None:
                  assert rc == 0, (label, rc, output)
                  expected = (initial[0] + delta,
                              initial[1] + (delta if source.endswith(".lean") else 0))
                  assert count(output) == expected, (label, expected, output)
              else:
                  assert rc == 1, (label, rc, output)
                  diagnostics = [line.strip() for line in output.splitlines()
                                 if line.startswith("  ") and not line.startswith("      ")]
                  if kind == "attributes":
                      expected = f"{source} attributes to {owner} a phrase {owner} does not contain:"
                  elif kind == "unquoted":
                      expected = f"{source} reports what {owner} says without quoting it:"
                  else:
                      expected = (f"{source} quotation after `{owner}` is cut by nested straight "
                                  "quotes; write the inner quotes curly")
                  assert diagnostics == [expected], (label, expected, output)
              print(f"PASS {source}: {label} (gate exit {rc})", flush=True)

          # The reported SPN-29/Ledger reproduction, changing only the quotation in its header.
          ledger = pathlib.Path("tools/formal/BtcPolicy/Ledger.lean")
          original = ledger.read_text()
          anchor = ('`SPN-29`\'s "If registration\nrefuses, only a reservation placed by this '
                    'request MUST be unwound in the same step"')
          assert original.count(anchor) == 1, "SPN-29 header quote drifted; re-quote its owner"
          false = "the moon is made of green cheese and nothing else"
          try:
              ledger.write_text(original.replace(anchor, f'`SPN-29`\'s "{false}"'))
              verify("SPN-29 header reproduction", str(ledger), *gate(), owner="SPN-29")
          finally:
              ledger.write_text(original)

          good = "No signature path MAY bypass the policy checks"
          inner = ('`DUR-5`\'s “A refused Carrier MUST NOT open any candidate” '
                   'preserves the existing opening bits')
          delivery = ('The state starts “definitely not sent”, advances to “possibly delivered, '
                      'exact bytes” on EVERY attempt that is not `NotSent` — BEFORE the status '
                      'line or body is decoded — and never moves backward')
          man_inner = ('Unsealed they were not adjustable either — `OPS-1` states '
                       '“Once a vault is sealed, nothing an Operator can do reconfigures it”, and')
          cases = [
              ("valid straight", f'`OVR-1`\'s "{good}"', None, "attributes", 1),
              ("valid curly", f'`OVR-1`\'s “{good}”', None, "attributes", 1),
              ("false straight", f'`OVR-1`\'s "{false}"', "OVR-1", "attributes", 0),
              ("false curly", f'`OVR-1`\'s “{false}”', "OVR-1", "attributes", 0),
              ("possessive then colon", f'`OVR-1`\'s "{good}"; `DOM-1`: “{false}”',
               "DOM-1", "attributes", 0),
              ("verb then possessive", f'`OVR-1` says "{good}"; `DOM-1`\'s “{false}”',
               "DOM-1", "attributes", 0),
              ("bare citation takes no quote", f'`OVR-1`\'s "{good}"; `DOM-1` “{false}”',
               "OVR-1", "attributes", 0),
              ("historical prose exempts", f'Previously, `OVR-1`\'s "{false}"',
               None, "attributes", 0),
              ("historical quote does not exempt", f'`OVR-1`\'s "the original {false}"',
               "OVR-1", "attributes", 0),
              ("teaching exemption", f'For example, `OVR-1`\'s "{false}"',
               None, "attributes", 0),
              ("quoted inner verb", '`MAN-2`\'s "Unsealed they were not adjustable either — '
               '`OPS-1` states “Once a vault is sealed, nothing an Operator can do reconfigures '
               'it”, and"', None, "attributes", 1),
              ("quoted inner possessive", f'`DUR-10`\'s "{inner}"', None, "attributes", 1),
              ("colon quotes inner possessive", f'`DUR-10`: "{inner}"', None, "attributes", 1),
              ("stray straight quote", f'Field is 6" wide and `OVR-1`\'s “{false}”',
               "OVR-1", "attributes", 0),
              ("stray straight quote before false straight", f'Field is 6" wide and `OVR-1`\'s "{false}"',
               "OVR-1", "attributes", 0),
              ("stray straight quote before valid straight", f'Field is 6" wide and `OVR-1`\'s "{good}"',
               None, "attributes", 1),
              ("stray straight quote before colon", f'Field is 6" wide and `OVR-1`: "{false}"',
               "OVR-1", "attributes", 0),
              ("stray straight quote before short quotation", 'Field is 6" wide and `MAN-3`\'s "currently `4`"',
               None, "attributes", 0),
              ("stray straight quote before split quotation", 'Field is 6" wide and `OVR-1`\'s "The rule ends. The next sentence starts"',
               None, "attributes", 0),
              ("stray straight quote with historical prose", f'Previously, field is 6" wide and `OVR-1`\'s "{false}"',
               None, "attributes", 0),
              ("stray straight quote with historical word inside", f'Field is 6" wide and `OVR-1`\'s "the original {false}"',
               "OVR-1", "attributes", 0),
              ("stray straight quote with quoted inner possessive", f'Field is 6" wide and `DUR-10`\'s "{inner}"',
               None, "attributes", 1),
              ("later false after possessive", f'`OVR-1`\'s "{good}"; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later false after speech verb", f'`OVR-1` says "{good}"; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later false after consultative prefix", f'Field is 6" wide; `DOM-1` reads the record and `OVR-1`\'s "{false}"',
               "OVR-1", "attributes", 0),
              ("later false after short straight quote", f'`MAN-3`\'s "currently `4`"; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later false after short curly quote", f'`MAN-3`\'s “currently `4`”; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later valid after possessive", f'`OVR-1`\'s "{good}"; field is 6" wide and `OVR-1`\'s "{good}"',
               None, "attributes", 2),
              ("later valid after speech verb", f'`OVR-1` says "{good}"; field is 6" wide and `OVR-1`\'s "{good}"',
               None, "attributes", 2),
              ("later valid after consultative prefix", f'Field is 6" wide; `DOM-1` reads the record and `OVR-1`\'s "{good}"',
               None, "attributes", 1),
              ("later valid after short quote", f'`MAN-3`\'s "currently `4`"; field is 6" wide and `OVR-1`\'s "{good}"',
               None, "attributes", 1),
              ("later short quote stays skipped", f'`OVR-1`\'s "{good}"; field is 6" wide and `MAN-3`\'s "currently `4`"',
               None, "attributes", 1),
              ("later historical word inside", f'`OVR-1`\'s "{good}"; field is 6" wide and `DOM-1`\'s "the original {false}"',
               "DOM-1", "attributes", 0),
              ("later historical prose exempts", f'`OVR-1`\'s "{good}"; previously, field is 6" wide and `DOM-1`\'s "{false}"',
               None, "attributes", 0),
              ("later quoted historical marker does not exempt", f'`POL-18`\'s "a retry keeps the original reservation time"; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later quoted inner possessive", f'`OVR-1`\'s "{good}"; field is 6" wide and `DUR-10`\'s "{inner}"',
               None, "attributes", 2),
              ("later quoted inner possessive after speech verb", f'`DUR-10` says "{inner}"; field is 6" wide and `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later false after consultative read and stray quote", f'`DOM-1` reads the record; field is 6" wide and `OVR-1`\'s "{false}"',
               "OVR-1", "attributes", 0),
              ("quoted inner possessive in second quotation", '`DUR-10`\'s "Every holder decision whose intent names a pair"; '
               f'and "{inner}"', None, "attributes", 1),
              ("curly inner quotes", f'`OPR-49`\'s "{delivery}"', None, "attributes", 1),
              ("nested straight quotes", '`OPR-49`\'s "' + delivery.replace('“', '"').replace('”', '"') + '"',
               "OPR-49", "cut", 0),
              ("short quotation stays skipped", '`MAN-3`\'s "currently `4`"', None, "attributes", 0),
              ("unquoted ratchet", '`OVR-1` says this rule applies', "OVR-1", "unquoted", 0),
              ("consultative reads", '`OVR-1` reads the record', None, "attributes", 0),
              ("consultative read", '`OVR-1` read the record', None, "attributes", 0),
              ("quoted reads checked", f'`OVR-1` reads "{false}"', "OVR-1", "attributes", 0),
              ("summary verb excluded", '`OVR-1` forbids automatic retry', None, "attributes", 0),
          ]
          # A skipped inner attribution must not end the outer owner's quotations.
          for form in ["'s", " says", ":"]:
              prefix = f'`MAN-2`{form} "{man_inner}" and '
              cases += [
                  (f"second false quote after inner attribution ({form})",
                   prefix + f'"{false} `DUR-5`\'s “A refused Carrier MUST NOT open any candidate” and more"',
                   "MAN-2", "attributes", 0),
                  (f"second wrong-owner quote after inner attribution ({form})",
                   prefix + f'"x `DOM-1`\'s “{false}” y"', "MAN-2", "attributes", 0),
                  (f"second genuine quote after inner attribution ({form})",
                   prefix + f'"{man_inner}"', None, "attributes", 1),
              ]
          cases += [
              ("later false preserves earlier repaired opener",
               f'Field is " wide and `OVR-1`\'s "{good}"; `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
              ("later valid preserves earlier repaired opener",
               f'Field is " wide and `OVR-1`\'s "{good}"; `OVR-1`\'s "{good}"',
               None, "attributes", 2),
              ("historical prose after inch mark",
               f'`OVR-1`\'s "{good}"; field is 6" wide previously "unused sentence"; `DOM-1`\'s "{false}"',
               None, "attributes", 0),
              ("historical word in quote after inch mark",
               f'`OVR-1`\'s "{good}"; field is 6" wide "previously unused"; `DOM-1`\'s "{false}"',
               "DOM-1", "attributes", 0),
          ]
          for source in ["citation-probe.md", "tools/formal/BtcPolicy/CitationProbe.lean",
                         "docs/adr/citation-probe.md"]:
              path = pathlib.Path(source)
              assert not path.exists(), f"scratch probe path already exists: {source}"
              try:
                  for label, text, owner, kind, delta in cases:
                      path.write_text(f"/-- {text}. -/\n" if source.endswith(".lean") else text + ".\n")
                      verify(label, source, *gate(), owner=owner, kind=kind, delta=delta)
              finally:
                  path.unlink()
          verify("restored tree", "", *gate())
          EOF

      # ADRs are checked sources, but never define numbered requirement owners.
      - name: Prove the citation gate checks ADR attributions and their exceptions
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          $SHELL_CMD python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          assert pathlib.Path("tools/formal/.lake/index.jsonl").is_file()
          baseline = pathlib.Path("tools/citation-baseline.json").read_bytes()
          source = pathlib.Path("docs/adr/citation-probe.md")
          assert not source.exists()

          def gate():
              p = subprocess.run([sys.executable, "tools/check_citations.py"],
                                 capture_output=True, text=True)
              assert pathlib.Path("tools/citation-baseline.json").read_bytes() == baseline
              return p.returncode, p.stdout + p.stderr

          def count(output):
              m = re.search(r"quoted attributions verified: (\d+), (\d+) of them", output)
              assert m, output
              return tuple(map(int, m.groups()))

          rc, output = gate()
          assert rc == 0, (rc, output)
          initial = count(output)
          good = "every input's `nSequence` to `0xfffffffd`"
          false = "every input sequence carries a purple umbrella"
          cases = [
              ("false ADR quote", f'`CHN-15` says "{false}"', "CHN-15", "attributes", 0),
              ("genuine ADR quote", f'`CHN-15` says "{good}"', None, None, 1),
              ("historical prose", f'Previously, `CHN-15` says "{false}"', None, None, 0),
              ("historical word inside false quote", f'`CHN-15` says "the original {false}"',
               "CHN-15", "attributes", 0),
              ("genuine quote containing historical word",
               '`POL-18` says "a retry keeps the original reservation time"', None, None, 1),
              ("quoted historical word cannot exempt later false attribution",
               '`POL-18` says "a retry keeps the original reservation time"; '
               f'`CHN-15` says "{false}"', "CHN-15", "attributes", 0),
              ("ADR unquoted ratchet", '`CHN-15` states this rule applies',
               "CHN-15", "unquoted", 0),
              ("ADR declaration resolution", '`BtcPolicy.Render.spn38Tabl`',
               "BtcPolicy.Render.spn38Tabl", "name", 0),
          ]
          try:
              for label, text, owner, kind, delta in cases:
                  source.write_text(text + ".\n")
                  rc, output = gate()
                  if owner is None:
                      assert rc == 0, (label, rc, output)
                      assert count(output) == (initial[0] + delta, initial[1]), (label, output)
                  else:
                      assert rc == 1, (label, rc, output)
                      if kind == "attributes":
                          expected = f"{source} attributes to {owner} a phrase {owner} does not contain:"
                      elif kind == "unquoted":
                          expected = f"{source} reports what {owner} says without quoting it:"
                      else:
                          expected = f"{source} cites `{owner}`, which the index does not carry"
                      diagnostics = [line.strip() for line in output.splitlines()
                                     if line.startswith("  ") and not line.startswith("      ")]
                      assert diagnostics == [expected], (label, expected, output)
                  print(f"PASS {label}: {source} (gate exit {rc})", flush=True)
          finally:
              source.unlink()
          rc, output = gate()
          assert rc == 0 and count(output) == initial, (rc, output)
          print("ADR citation gate controls passed; baseline bytes unchanged")
          PY

      # Text found only in another ADR must neither validate a quote nor make two
      # genuine owner quotations look like one quotation cut by nested straight quotes.
      - name: Prove the citation gate excludes unrelated ADR quotation evidence
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          $SHELL_CMD python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          assert pathlib.Path("tools/formal/.lake/index.jsonl").is_file()
          baseline = pathlib.Path("tools/citation-baseline.json").read_bytes()
          unrelated = pathlib.Path("docs/adr/citation-unrelated.md")
          assert not unrelated.exists()
          false = "every input sequence carries a purple umbrella"
          # The poisoned text is absent from all possible existing quotation sources.
          for pattern in ["*.md", "docs/adr/*.md", "tools/formal/**/*.lean"]:
              for path in pathlib.Path(".").glob(pattern):
                  assert false not in path.read_text(), str(path)

          def gate():
              p = subprocess.run([sys.executable, "tools/check_citations.py"],
                                 capture_output=True, text=True)
              assert pathlib.Path("tools/citation-baseline.json").read_bytes() == baseline
              return p.returncode, p.stdout + p.stderr

          def count(output):
              m = re.search(r"quoted attributions verified: (\d+), (\d+) of them", output)
              assert m, output
              return tuple(map(int, m.groups()))

          rc, output = gate()
          assert rc == 0, (rc, output)
          initial = count(output)
          first = "every input's `nSequence` to `0xfffffffd`"
          second = "bit 31 set so BIP68 relative locks stay disabled"
          combined = f'{first}" and "{second}'
          for pattern in ["*.md", "docs/adr/*.md", "tools/formal/**/*.lean"]:
              for path in pathlib.Path(".").glob(pattern):
                  assert combined not in path.read_text(), str(path)
          try:
              for filename in ["citation-probe.md", "tools/formal/BtcPolicy/CitationProbe.lean",
                               "docs/adr/citation-probe.md"]:
                  source = pathlib.Path(filename)
                  assert not source.exists()
                  def write(text):
                      source.write_text(f"/-- {text}. -/\n" if source.suffix == ".lean" else text + ".\n")
                  try:
                      for poisoned in [False, True]:
                          # A fake definition here must not become a numbered requirement owner.
                          unrelated.write_text(f"**CHN-15** {false}.\n" if poisoned else "")
                          write(f'`CHN-15` says "{false}"')
                          rc, output = gate()
                          assert rc == 1, (filename, poisoned, rc, output)
                          diagnostics = [line.strip() for line in output.splitlines()
                                         if line.startswith("  ") and not line.startswith("      ")]
                          expected = f"{source} attributes to CHN-15 a phrase CHN-15 does not contain:"
                          assert diagnostics == [expected], (filename, poisoned, output)
                          print(f"PASS false quote: {source}, ADR poison={poisoned} (gate exit {rc})", flush=True)
                      for poisoned in [False, True]:
                          unrelated.write_text(combined + "\n" if poisoned else "")
                          write(f'`CHN-15` says "{combined}"')
                          rc, output = gate()
                          assert rc == 0, (filename, poisoned, rc, output)
                          expected = (initial[0] + 1, initial[1] + (source.suffix == ".lean"))
                          assert count(output) == expected, (filename, poisoned, expected, output)
                          print(f"PASS separate genuine quotes: {source}, ADR poison={poisoned} (gate exit {rc})", flush=True)
                  finally:
                      source.unlink()
          finally:
              unrelated.unlink()
          rc, output = gate()
          assert rc == 0 and count(output) == initial, (rc, output)
          print("Unrelated ADR citation gate controls passed; baseline bytes unchanged")
          PY

      # One docstring per arm of load()'s detector: `/- remark -/` puts a `/-` in the regex's body;
      # `/-/` ends the body in `/`, so only the closer load() appends completes the `/-`. load()
      # reports each and main() refuses; the count is asserted, so dropping either arm is red. The
      # false quote after each nested comment is what the refusal keeps unread.
      - name: Prove the citation gate refuses a block comment nested in a Lean docstring
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n%s\n%s\n' \
            '/-! Intro /-/ remark -/ `OVR-1` says "a phrase OVR-1 has never contained anywhere". -/' \
            '/-! Intro /- remark -/ `OVR-1` says "a phrase OVR-1 has never contained anywhere". -/' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a block comment nested in a Lean docstring"
            exit 1
          fi
          if ! grep -Eq 'tools/formal/BtcPolicy/Delivery\.lean:[0-9]+: a docstring nests a /- -/ block comment' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without naming the Delivery.lean line whose docstring nests a block comment"
            exit 1
          fi
          if ! grep -q 'FAIL: 2 Lean docstring(s) nest a block comment' citations.log; then
            cat citations.log
            echo "::error::citation gate refused fewer than both nested block-comment shapes; one detector arm is dropped"
            exit 1
          fi
          echo "citation gate correctly refused both block-comment shapes nested in a Lean docstring"

      # Two colon-form attributions in one sentence: OVR-1's quote is true, DOM-1's is false. Red
      # proves the colon form is read; blaming DOM-1 and not OVR-1 proves the second quote is held
      # to the attribution it follows, not the sentence's first.
      - name: Prove the citation gate checks a colon-form attribution against its own owner
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n/-- `OVR-1`: "No signature path MAY bypass the policy checks"; `DOM-1`: "a phrase DOM-1 has never contained anywhere". -/\n' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a false colon-form quote in a Lean docstring"
            exit 1
          fi
          if ! grep -q 'tools/formal/BtcPolicy/Delivery.lean attributes to DOM-1 a phrase DOM-1 does not contain' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without blaming DOM-1 for the false colon-form quote"
            exit 1
          fi
          if grep -q 'attributes to OVR-1' citations.log; then
            cat citations.log
            echo "::error::citation gate held DOM-1's quote to OVR-1, the sentence's first attribution"
            exit 1
          fi
          echo "citation gate correctly rejected a false colon-form quote and blamed its own owner"

      # A false quote whose only historical marker, "the original", sits inside the quotation. Red
      # proves HISTORICAL reads only the prose outside a chunk's quotes: a word the quoted text
      # carries does not exempt the chunk, which is how a correct `POL-18` quote went unchecked.
      - name: Prove the citation gate checks a quote whose historical marker is only inside it
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n/-- `OVR-1`: "the original phrase OVR-1 has never contained anywhere". -/\n' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a false quote carrying a historical marker inside it"
            exit 1
          fi
          if ! grep -q 'tools/formal/BtcPolicy/Delivery.lean attributes to OVR-1 a phrase OVR-1 does not contain' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without naming the false OVR-1 quote carrying a historical marker inside it"
            exit 1
          fi
          echo "citation gate correctly checked a quote whose historical marker is only inside it"

      # MAN-2's body carries "`OPS-1` states", and quoting that span (its inner quotes curly, so the
      # quotation is one span) is correct prose. Green, with no unquoted OPS-1 and nothing blamed,
      # proves an attribution-shaped phrase inside a quotation is quoted, not made.
      - name: Prove the citation gate reads an attribution inside a quotation as quoted text
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n/-- `MAN-2`: "Unsealed they were not adjustable either — `OPS-1` states “Once a vault is sealed, nothing an Operator can do reconfigures it”, and". -/\n' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if grep -q 'attributes to MAN-2' citations.log; then
            cat citations.log
            echo "::error::the probe's quote drifted from MAN-2's body; re-quote MAN-2 in this step"
            exit 1
          fi
          if grep -Eq 'reports what OPS-1 says|Delivery.lean attributes to OPS-1' citations.log; then
            cat citations.log
            echo "::error::citation gate read an attribution-shaped phrase inside a quotation as an attribution"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 0, on a correct quotation carrying an attribution-shaped phrase"
            exit 1
          fi
          echo "citation gate correctly read an attribution inside a quotation as quoted text"

      # A stray unpaired straight quote (the inch mark) opens a bogus span that reaches into the
      # attribution. No earlier attribution introduced that span, so it suppresses nothing: OVR-1
      # is read, has no quote of its own, and is a new unquoted attribution against an empty
      # baseline. Red proves in-quote suppression is ownership-based, not span-based.
      - name: Prove the citation gate reads an attribution after an unpaired straight quote
        if: matrix.shard == 3
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n%s\n' '/-- Field is 6" wide and `OVR-1` says "this phrase OVR-1 does not contain at all". -/' \
            >> tools/formal/BtcPolicy/Delivery.lean
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on an unquoted attribution after an unpaired straight quote"
            exit 1
          fi
          if ! grep -q 'tools/formal/BtcPolicy/Delivery.lean reports what OVR-1 says without quoting it' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without reporting OVR-1 as unquoted after an unpaired straight quote"
            exit 1
          fi
          echo "citation gate correctly read an attribution after an unpaired straight quote"

      # OPR-49's docstring quotation nests two curly pairs. Straightened, QUOTE cuts it into three
      # spans and the nested text falls between them, unchecked, with the verified count unmoved.
      # Red proves the spans are read outer quote to outer quote and the match named as a cut.
      # The sed is guarded: a re-worded docstring makes this step red, not vacuous.
      - name: Prove the citation gate detects a quotation cut by nested straight quotes
        if: matrix.shard == 2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/“definitely not sent”/"definitely not sent"/; s/“possibly delivered, exact bytes”/"possibly delivered, exact bytes"/' \
            tools/formal/BtcPolicy/Delivery.lean
          if ! grep -q 'starts "definitely not sent", advances to "possibly delivered, exact bytes"' tools/formal/BtcPolicy/Delivery.lean; then
            echo "::error::the OPR-49 docstring in Delivery.lean no longer carries the curly pairs this step straightens"
            exit 1
          fi
          rc=0; $SHELL_CMD python3 tools/check_citations.py > citations.log 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            cat citations.log
            echo "::error::citation gate exited $rc, not 1, on a quotation cut by nested straight quotes"
            exit 1
          fi
          if ! grep -q 'tools/formal/BtcPolicy/Delivery.lean quotation after `OPR-49` is cut by nested straight quotes' citations.log; then
            cat citations.log
            echo "::error::citation gate went red without naming the OPR-49 quotation as cut by nested straight quotes"
            exit 1
          fi
          echo "citation gate correctly detected a quotation cut by nested straight quotes"

      - name: Prove the vector gate can fail
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          # Flip the first hex digit of the first published digest.
          $SHELL_CMD python3 - <<'EOF'
          import re
          p = "08-wire-contract.md"
          s = open(p).read()
          m = re.search(r"^digest = ([0-9a-f])", s, re.M)
          assert m, "no digest line to corrupt"
          flipped = "0" if m.group(1) != "0" else "1"
          s = s[: m.start(1)] + flipped + s[m.end(1):]
          open(p, "w").write(s)
          EOF
          if $SHELL_CMD python3 tools/check_vectors.py; then
            echo "::error::vector gate passed a corrupted digest"
            exit 1
          fi
          echo "vector gate correctly rejected a corrupted digest"

      # The copies and regions gates (ADR-0023 decision 5) carry the fourteen controls
      # the arithmetic gate had, eleven and three, plus the ones added since; each edits an
      # owning figure, a copy of one, or a rendered row, and names the refusal it expects.
      # tools/check_gate_controls.py holds the lists.
      - name: Prove the copies gate can fail
        if: matrix.shard == 3
        run: $SHELL_CMD python3 tools/check_gate_controls.py copies

      - name: Prove the regions gate can fail
        if: matrix.shard == 3
        run: $SHELL_CMD python3 tools/check_gate_controls.py regions

      - name: Prove the fixture gate can fail
        if: matrix.shard == 0
        run: $SHELL_CMD python3 tools/check_gate_controls.py fixtures

      - name: Prove vector profiles and required fixtures can fail
        if: matrix.shard == 3
        run: $SHELL_CMD python3 tools/check_gate_controls.py vectors

      # The formal layer's controls (ADR-0023). Each breaks the specific thing its
      # check guards, and each asserts the failure came from that check and not from
      # a syntax error or a missing toolchain -- a red build for the wrong reason is
      # not evidence the gate works. The first four flip a guard parameter's `current`
      # value (decision 6); the red must come from Exhibits.lean and nowhere else.
      - name: Prove the Lean build rejects the SPN-38 cap anchored on the cursor (F51)
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : Anchor := .onF$/def current : Anchor := .onCursor/' BtcPolicy/Cursor.lean
          grep -q 'def current : Anchor := .onCursor' BtcPolicy/Cursor.lean
          if $SHELL_CMD lake build > build.log 2>&1; then
            echo "::error::lake build passed with the cap anchored on the cursor"
            exit 1
          fi
          test "$(grep -c '^error: BtcPolicy/' build.log)" -eq 5
          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the anchor flip broke something outside Exhibits.lean"
            exit 1
          fi
          # The five refuted propositions are the five exhibits over `current`, by name.
          grep -A4 'proved that the proposition' build.log | grep -q 'quotaRungCap Cursor.current'
          grep -A4 'proved that the proposition' build.log | grep -q 'rowOk Cursor.current'
          grep -A4 'proved that the proposition' build.log | grep -q 'pass Cursor.current'
          grep -A4 'proved that the proposition' build.log | grep -q 'capFormula ='
          grep -A4 'proved that the proposition' build.log | grep -q 'releases Cursor.current'
          echo "lake build correctly failed on rows_reproduce, rows_fit_and_progress, f51_current_admits, cap_formula_current and dur30_split_finalizes_lower_latch"

      - name: Prove the Lean build rejects the SPN-46 refresh age read from a node's own log (F52)
        if: matrix.shard == 1
