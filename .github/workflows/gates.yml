          grep -q 'error: BtcPolicy/Exhibits.lean:.*decide. proved that the proposition' build.log
          if grep '^error: BtcPolicy/' build.log | grep -v 'BtcPolicy/Exhibits.lean' | grep -q .; then
            echo "::error::the source flip broke something outside Exhibits.lean"
            exit 1
          fi
          grep -A4 'proved that the proposition' build.log | grep -q 'verdict RefreshAge.current'
          grep -A4 'proved that the proposition' build.log | grep -q 'bumpVerdict RefreshAge.current = true'
          echo "lake build correctly failed on f52_refused_with_current and wtc25_replacement_admitted_with_current"

      - name: Prove the Lean build rejects the DUR-22 denominator that restores one Escape (F54)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : Denominator := .restoreAll$/def current : Denominator := .restoreOne/' BtcPolicy/Coverage.lean
          grep -q 'def current : Denominator := .restoreOne' BtcPolicy/Coverage.lean
